# Generated by Ephemeris. Do not edit by hand.
name: Pull request
on:
  pull_request: {}
concurrency:
  cancel-in-progress: true
  group: pull_request-${{ forge.ref }}
jobs:
  comment-end:
    name: Report PR review results
    runs-on: calf-normal
    needs:
      - comment-start
      - quality
    if: ${{ !cancelled() }}
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_options: '--yes'
      - id: credential
        name: Read the forge credential
        run: |
          value="$(nix run .#ephemeris -- credential read forge)"
          echo "::add-mask::$value"
          echo "value=$value" >> "$FORGEJO_OUTPUT"
        env:
          NOMOBOT_EPHEMERIS_AUDIENCE: ${{ vars.NOMOBOT_EPHEMERIS_AUDIENCE }}
      - name: Update pull request comment
        uses: https://codeberg.org/inomotech/actions-comment-pull-request@e007c4a9d16daf06989ab390ba8c2d45632acb01
        with:
          GITHUB_TOKEN: ${{ steps.credential.outputs.value }}
          comment_tag: pr-review
          create_if_not_exists: false
          message: |-
            # Review

            Completed for commit ${{ forge.sha }}.

            ${{ needs.quality.outputs.summary }}
  comment-start:
    name: Report PR review start
    runs-on: calf-normal
    if: ${{ !cancelled() }}
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_options: '--yes'
      - id: credential
        name: Read the forge credential
        run: |
          value="$(nix run .#ephemeris -- credential read forge)"
          echo "::add-mask::$value"
          echo "value=$value" >> "$FORGEJO_OUTPUT"
        env:
          NOMOBOT_EPHEMERIS_AUDIENCE: ${{ vars.NOMOBOT_EPHEMERIS_AUDIENCE }}
      - name: Update pull request comment
        uses: https://codeberg.org/inomotech/actions-comment-pull-request@e007c4a9d16daf06989ab390ba8c2d45632acb01
        with:
          GITHUB_TOKEN: ${{ steps.credential.outputs.value }}
          comment_tag: pr-review
          create_if_not_exists: false
          message: |-
            # Review

            Running for commit ${{ forge.sha }}.
  gate:
    name: Gate
    runs-on: calf-normal
    needs:
      - quality
    if: ${{ always() }}
    steps:
      - name: Require upstream jobs
        run: test '${{ needs.quality.result }}' = success
  quality:
    name: Repository checks
    runs-on: calf-normal
    outputs:
      summary: ${{ steps.summary.outputs.markdown }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_options: '--yes'
      - id: reports
        name: Build check reports
        run: nix build .#ephemeris-reports --out-link reports
      - id: checks
        name: Run enabled applicable checks
        run: nix run .#ephemeris-check -- run-applicable --context checkout
      - name: Run flake checks
        run: nix flake check
      - id: summary
        name: Build summary
        if: ${{ always() }}
        run: |
          shopt -s nullglob
          {
            echo 'markdown<<EOF'
            echo '## Repository checks'
            nix run .#ephemeris -- report summary reports/* .ephemeris/reports/*
            echo EOF
          } >> "$FORGEJO_OUTPUT"
