name: Repository
on:
  push:
    branches:
      - main
concurrency:
  cancel-in-progress: false
  group: repository
jobs:
  apply:
    name: Apply repository settings
    runs-on: calf-normal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_options: '--yes'
      - name: Apply repository settings
        run: nix run .#ephemeris -- repository apply
        env:
          FORGEJO_TOKEN: ${{ secrets.NOMOBOT_REPO_WRITE_TOKEN }}
