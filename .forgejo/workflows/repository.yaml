# Generated by Ephemeris. Do not edit by hand.
name: Repository
on:
  push:
    branches:
      - main
concurrency:
  cancel-in-progress: false
  group: repository
jobs:
  apply:
    name: Apply repository settings
    runs-on: calf-normal
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_options: '--yes'
      - name: Set up the build cache
        uses: https://codeberg.org/inomotech/calf-granary@d16ce853bb13d44abc37e4521ae795cf2f9e0c55
        with:
          audience: calf-granary
          server: https://granary.svc.inomo.tech
      - name: Apply repository settings
        run: nix run .#ephemeris -- repository apply
        env:
          NOMOBOT_EPHEMERIS_AUDIENCE: ${{ vars.NOMOBOT_EPHEMERIS_AUDIENCE }}
