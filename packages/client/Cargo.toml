[package]
name = "calf-granary-client"
description = "Build cache client for CI runners"
categories = ["command-line-utilities", "development-tools::build-utils"]
keywords = ["cache", "ci", "nix", "yocto"]
readme.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
bytes = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio-util = { workspace = true, features = ["io"] }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["std"] }

[dependencies.clap]
workspace = true
features = ["derive", "env", "error-context", "help", "std", "usage"]

[dependencies.tokio]
workspace = true
features = ["fs", "io-util", "macros", "process", "rt-multi-thread"]

[dependencies.tracing-subscriber]
workspace = true
features = ["ansi", "env-filter", "fmt", "std"]

[lints]
workspace = true
