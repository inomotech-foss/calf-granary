[package]
name = "calf-granary-server"
description = "Build cache server for CI runners"
categories = ["development-tools::build-utils"]
keywords = ["cache", "ci", "nix", "yocto"]
readme.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
aws-lc-rs = { workspace = true, features = ["aws-lc-sys"] }
axum = { workspace = true, features = [
  "http1",
  "json",
  "matched-path",
  "tokio",
] }
bytes = { workspace = true }
calf-granary-server-db = { workspace = true, features = ["deadpool"] }
chrono = { workspace = true, features = ["clock"] }
deadpool-postgres = { workspace = true, features = ["rt_tokio_1"] }
fastcdc = { workspace = true }
futures = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
object_store = { workspace = true, features = ["aws"] }
opentelemetry = { workspace = true, features = [
  "internal-logs",
  "logs",
  "metrics",
  "trace",
] }
opentelemetry-appender-tracing = { workspace = true }
opentelemetry_sdk = { workspace = true, features = [
  "internal-logs",
  "logs",
  "metrics",
  "trace",
] }
reqwest = { workspace = true, features = ["json", "rustls"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
rustls-pki-types = { workspace = true, features = ["std"] }
rustls-platform-verifier = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio-postgres = { workspace = true, features = ["runtime"] }
tokio-postgres-rustls = { workspace = true, features = ["aws-lc-rs"] }
toml = { workspace = true, features = ["parse", "serde", "std"] }
tracing = { workspace = true, features = ["std"] }
tracing-opentelemetry = { workspace = true }
zstd = { workspace = true }

[dependencies.clap]
workspace = true
features = ["derive", "env", "error-context", "help", "std", "usage"]

[dependencies.opentelemetry-otlp]
workspace = true
features = [
  "http-proto",
  "internal-logs",
  "logs",
  "metrics",
  "reqwest-blocking-client",
  "trace",
]

[dependencies.tokio]
workspace = true
features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"]

[dependencies.tracing-subscriber]
workspace = true
features = ["ansi", "env-filter", "fmt", "registry", "std"]

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
