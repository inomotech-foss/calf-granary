[package]
name = "calf-granary-server"
description = "Build cache server for CI runners"
categories = ["development-tools::build-utils"]
keywords = ["cache", "ci", "nix", "yocto"]
readme.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-postgres = { workspace = true, features = ["runtime"] }
tracing = { workspace = true, features = ["std"] }

[dependencies.clap]
workspace = true
features = ["derive", "env", "error-context", "help", "std", "usage"]

[dependencies.tracing-subscriber]
workspace = true
features = ["ansi", "env-filter", "fmt", "std"]

[lints]
workspace = true
