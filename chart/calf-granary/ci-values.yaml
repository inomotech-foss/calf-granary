image:
  tag: test
config: |
  public_url = "https://granary.example.org"
  anonymous_caches = ["sstate-main"]

  [stores.long]
  bucket = "granary-long"

  [caches.sstate-main]
  store = "long"
  role = "sstate"
  retention = "30d"
database:
  secretName: granary-database
tokenSecret:
  secretName: granary-token
storage:
  secretName: granary-storage
signingKeys:
  secretName: granary-signing-keys
otel:
  metricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
route:
  enabled: true
  hostnames:
    - granary.example.org
  parentRefs:
    - name: gateway
      namespace: gateway
