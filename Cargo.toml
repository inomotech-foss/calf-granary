[workspace]
members = ["packages/client", "packages/server", "packages/server-db"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://codeberg.org/inomotech/calf-granary"
readme = "README.md"
rust-version = "1.99"
version = "0.1.0"
description = "Build caches for CI runners"

[workspace.dependencies]
calf-granary-server-db = { path = "packages/server-db", default-features = false, version = "0.1.0" }

async-compression = { version = "0.4.51", default-features = false }
aws-lc-rs = { version = "1.18.2", default-features = false }
axum = { version = "0.8.9", default-features = false }
base64 = { version = "0.22.1", default-features = false }
bytes = { version = "1.12.1", default-features = false }
chrono = { version = "0.4.45", default-features = false }
clap = { version = "4.6.7", default-features = false }
deadpool-postgres = { version = "0.14.2", default-features = false }
fastcdc = { version = "5.0.0", default-features = false }
futures = { version = "0.3.34", default-features = false }
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
jsonwebtoken = { version = "11.1.0", default-features = false }
object_store = { version = "0.14.2", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false }
opentelemetry-appender-tracing = { version = "0.33.1", default-features = false }
opentelemetry-otlp = { version = "0.33.1", default-features = false }
opentelemetry_sdk = { version = "0.33.1", default-features = false }
postgres = { version = "0.19.14", default-features = false }
postgres-protocol = { version = "0.6.12", default-features = false }
postgres-types = { version = "0.2.14", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
rustls = { version = "0.23.46", default-features = false }
rustls-pki-types = { version = "1.15.1", default-features = false }
rustls-platform-verifier = { version = "0.7.1", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.154", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.54.0", default-features = false }
tokio-postgres = { version = "0.7.18", default-features = false }
tokio-postgres-rustls = { version = "0.14.0", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
toml = { version = "1.1.8", default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
url = { version = "2.5.8", default-features = false }
zstd = { version = "0.14.3", default-features = false }

# Managed by Ephemeris. Set lints through ephemeris.rust.lints.
[workspace.lints]

[workspace.lints.clippy]
absolute_paths = "warn"
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
arbitrary_source_item_ordering = "warn"
arithmetic_side_effects = "warn"
as_pointer_underscore = "warn"
as_underscore = "warn"
cargo = { level = "warn", priority = -1 }
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
dbg_macro = "warn"
default_union_representation = "warn"
deref_by_slicing = "warn"
doc_include_without_cfg = "warn"
doc_paragraphs_missing_punctuation = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
exit = "warn"
expect_used = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
inline_modules = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
map_with_unused_argument_over_ranges = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
mixed_read_write_in_expression = "warn"
mod_module_files = "warn"
module_name_repetitions = "warn"
multiple_crate_versions = "allow"
multiple_unsafe_ops_per_block = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_raw_strings = "warn"
non_ascii_literal = "warn"
non_zero_suggestions = "warn"
nursery = { level = "warn", priority = -1 }
panic = "warn"
panic_in_result_fn = "warn"
partial_pub_fields = "warn"
pathbuf_init_then_push = "warn"
pedantic = { level = "warn", priority = -1 }
pointer_format = "warn"
precedence_bits = "warn"
print_stderr = "warn"
print_stdout = "warn"
pub_without_shorthand = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_pub_crate = "allow"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
renamed_function_params = "warn"
rest_pattern_accessible_field = "warn"
return_and_then = "warn"
same_name_method = "warn"
semicolon_outside_block = "warn"
separated_literal_suffix = "warn"
shadow_unrelated = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
string_slice = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_rest_pattern = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unused_trait_names = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
use_debug = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
closure_returning_async_block = "warn"
deprecated_in_future = "warn"
deref_into_dyn_supertrait = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
impl_trait_redundant_captures = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
private_doc_tests = "warn"
unescaped_backticks = "warn"
